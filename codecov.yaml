comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

coverage:
  status:
    project:
      default:
        target: 65%
        threshold: 1%
    patch:
      default:
        target: 100%
        threshold: 0%
