repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-docstring-first
  - id: check-yaml
    exclude: "^.gitlab-ci.yml$"
  - id: check-yaml
    args:
      - --unsafe
    files: "^.gitlab-ci.yml$"
  - id: check-toml
  - id: debug-statements
  - id: check-ast

- repo: https://github.com/psf/black
  rev: 25.12.0
  hooks:
  - id: black
    language_version: python3

- repo: https://github.com/PyCQA/flake8/
  rev: 7.3.0
  hooks:
  - id: flake8
    additional_dependencies: [flake8-docstrings]

- repo: https://github.com/PyCQA/isort
  rev: 7.0.0
  hooks:
  - id: isort
    args: ["--profile", "black", "--filter-files"]
    #    additional_dependencies: [toml]

- repo: https://github.com/PyCQA/doc8
  rev: v2.0.0
  hooks:
  - id: doc8

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.20.2
  hooks:
  - id: mypy
    args: [--strict, --pretty, --show-error-codes]
    exclude: ^(docs/source/conf\.py|examples/hydro\.py|\.github/scripts/home_assistant_versions\.py|tests/scenarios/test_dt\.py)$
    pass_filenames: false
    entry: mypy --strict --pretty --show-error-codes --disable-error-code import-not-found --disable-error-code unused-ignore hydroqc/ tests/
    additional_dependencies:
      - "types-pytz==2025.2.0.20251108"
      - "types-PyYAML==6.0.12.20260724"
      - "types-python-dateutil==2.9.0.20260807"
      - "pytest-stub==1.1.0"
      - "aiohttp==3.14.3"
      - "aiocache==0.12.3"
      - "pkce==1.0.3"
      - "pytest-asyncio==1.4.0"
